<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Vinyl Records List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        .user-info {
            color: #555;
        }
        .user-info strong {
            color: #333;
        }
        .logout-btn {
            background-color: #f44336;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .logout-btn:hover {
            background-color: #da190b;
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            text-align: left;
        }
        td {
            border: 1px solid #ddd;
            padding: 10px;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #ddd;
        }
        .admin-badge {
            background-color: #ff9800;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            margin-left: 5px;
        }
        .links {
            margin-top: 20px;
        }
        .links a {
            margin-right: 15px;
            color: #2196F3;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<!-- Шапка с информацией о пользователе -->
<div class="header">
    <div class="user-info">
        Вы вошли как: <strong sec:authentication="name">User</strong>
        <span sec:authorize="hasRole('ADMIN')" class="admin-badge">ADMIN</span>
    </div>
    <form th:action="@{/logout}" method="post" style="margin: 0;">
        <button type="submit" class="logout-btn">Выйти</button>
    </form>
</div>

<h1>Список виниловых пластинок</h1>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Год</th>
        <th>Цена</th>
        <th>Состояние</th>
        <th>Жанр</th>
        <th>Лейбл</th>
    </tr>
    </thead>
    <tbody>
    <!-- Перебираем все записи из модели -->
    <tr th:each="record : ${records}">
        <td th:text="${record.id}"></td>
        <td th:text="${record.title}"></td>
        <td th:text="${record.year}"></td>
        <td th:text="${record.price}"></td>
        <td th:text="${record.condition}"></td>
        <!-- Безопасное отображение связанных сущностей -->
        <td th:text="${record.genre != null ? record.genre.name : 'N/A'}"></td>
        <td th:text="${record.label != null ? record.label.name : 'N/A'}"></td>
    </tr>
    </tbody>
</table>

<div class="links">
    <!-- Swagger UI доступен только для ADMIN -->
    <a sec:authorize="hasRole('ADMIN')" href="/swagger-ui/index.html" target="_blank">
        📖 API Документация (Swagger UI)
    </a>
    <a href="/api/vinyl/searchByYearAndPrice?startYear=1970&endYear=2000&maxPrice=100">
        🔍 Поиск по годам и цене (API)
    </a>
</div>
</body>
</html>
