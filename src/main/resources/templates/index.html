<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Vinyl Store - Главная</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            margin: 10px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        .btn-primary:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background-color: #2196F3;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #0b7dda;
            transform: translateY(-2px);
        }
        .user-greeting {
            background-color: #e8f5e9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎵 Vinyl Store</h1>
    <p>Коллекция виниловых пластинок</p>

    <!-- Если пользователь авторизован -->
    <div sec:authorize="isAuthenticated()" class="user-greeting">
        <p>Добро пожаловать, <strong sec:authentication="name">User</strong>!</p>
        <a href="/vinyl/view/list" class="btn btn-primary">Смотреть каталог</a>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-secondary">Выйти</button>
        </form>
    </div>

    <!-- Если пользователь НЕ авторизован -->
    <div sec:authorize="!isAuthenticated()">
        <a href="/login" class="btn btn-primary">Войти</a>
        <a href="/registration" class="btn btn-secondary">Регистрация</a>
    </div>
</div>
</body>
</html>
